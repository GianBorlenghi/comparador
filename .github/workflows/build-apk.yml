name: Build APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev libssl-dev libbz2-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33

      - name: Pre-accept Android licenses + fix sdkmanager path
        run: |
          # Licencias para el SDK privado de Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2589b7190390" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "y" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license || true
          mkdir -p ~/.android && echo "y" > ~/.android/repositories.cfg || true
          # Fix: Buildozer busca sdkmanager en tools/bin (viejo) pero el SDK nuevo está en cmdline-tools/latest/bin
          # Creamos el symlink esperado para que no falle "sdkmanager does not exist"
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager 2>/dev/null || true
            echo "Symlink sdkmanager creado desde ANDROID_HOME"
          elif [ -f "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager 2>/dev/null || true
            echo "Symlink sdkmanager creado desde /usr/local"
          fi
          ls -lh ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager 2>&1 | head -n 5 || true
          cat ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Build APK
        working-directory: pycom/app
        run: |
          buildozer android debug

      - name: List APK
        if: always()
        run: |
          find . -name "*.apk" -type f 2>/dev/null | head -n 20 || true
          ls -lh pycom/app/bin/ 2>&1 | head -n 30 || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PergaminoPrecios-APK
          path: pycom/app/bin/*.apk
          if-no-files-found: warn
