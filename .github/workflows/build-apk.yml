name: Build APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: thopiekar/buildozer:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK (Docker)
        working-directory: pycom/app
        run: |
          rm -rf ~/.buildozer 2>/dev/null || true
          buildozer android debug

      - name: List APK
        if: always()
        run: |
          find . -name "*.apk" -type f 2>/dev/null | head -n 20 || true
          ls -lh pycom/app/bin/ 2>&1 | head -n 30 || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PergaminoPrecios-APK
          path: pycom/app/bin/*.apk
          if-no-files-found: warn
