name: Build APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev libssl-dev libbz2-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33

      - name: Build APK
        working-directory: pycom/app
        run: |
          # Limpia cache previa para evitar sdkmanager roto
          rm -rf ~/.buildozer 2>/dev/null || true
          buildozer android debug

      - name: List APK
        if: always()
        run: |
          find . -name "*.apk" -type f 2>/dev/null | head -n 20 || true
          ls -lh pycom/app/bin/ 2>&1 | head -n 30 || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PergaminoPrecios-APK
          path: pycom/app/bin/*.apk
          if-no-files-found: warn
