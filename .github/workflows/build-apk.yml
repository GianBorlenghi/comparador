name: Build APK Nativo

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Build Debug APK
        working-directory: pycom/android
        run: |
          gradle --version
          gradle assembleDebug --stacktrace
      - name: List APK
        if: always()
        run: |
          find pycom -name "*.apk" -type f 2>/dev/null | head -n 20 || true
          ls -lh pycom/android/app/build/outputs/apk/debug/ 2>&1 | head -n 20 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PergaminoPrecios-Nativo-APK
          path: pycom/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
