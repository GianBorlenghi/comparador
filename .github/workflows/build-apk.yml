name: Build APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Usamos Docker con Buildozer ya configurado (evita sdkmanager 37 / aidl)
    container:
      image: kivymd/buildozer:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK (Docker)
        working-directory: pycom/app
        run: |
          # Limpia cache corrupta si existe
          rm -rf ~/.buildozer 2>/dev/null || true
          # Fuerza build-tools estable
          sed -i 's/^android.build_tools_version.*/android.build_tools_version = 33.0.2/' buildozer.spec || echo "android.build_tools_version = 33.0.2" >> buildozer.spec
          buildozer android debug

      - name: List APK
        if: always()
        run: |
          find . -name "*.apk" -type f 2>/dev/null | head -n 20 || true
          ls -lh pycom/app/bin/ 2>&1 | head -n 30 || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PergaminoPrecios-APK
          path: pycom/app/bin/*.apk
          if-no-files-found: warn
