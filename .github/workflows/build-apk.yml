name: Build APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Accept Android Licenses
        run: |
          mkdir -p ~/.android
          echo "y" > ~/.android/repositories.cfg || true
          # Pre-accept licenses via sdkmanager if available
          yes | sdkmanager --licenses 2>/dev/null || true
          # Alternative: let buildozer handle it but ensure aidl exists
          sudo mkdir -p /opt/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" | sudo tee /opt/android-sdk/licenses/android-sdk-license > /dev/null || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" | sudo tee -a /opt/android-sdk/licenses/android-sdk-license > /dev/null || true
          echo "24333f8a63b6825ea9c5514f83c2589b7190390" | sudo tee -a /opt/android-sdk/licenses/android-sdk-license > /dev/null || true

      - name: Build APK
        working-directory: pycom/app
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PergaminoPrecios-APK
          path: pycom/app/bin/*.apk
